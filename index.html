<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Cloud Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; max-width: 500px; margin: 40px auto; padding: 20px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .config-box { background: #1e1e1e; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #333; }
        input { width: 90%; padding: 8px; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: monospace; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #refreshBtn { background: #d97706; }
        #redeployBtn { background: #059669; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; background: #222; font-family: monospace; font-size: 13px; color: #0f0; }
    </style>
</head>
<body>

    <h1>🌌 Interstellar Cloud Controller</h1>
    
    <div class="config-box">
        <label style="font-size: 12px; color: #9ca3af;">🔑 ENTER YOUR GITHUB API KEY:</label><br><br>
        <input type="password" id="apiKey" placeholder="ghp_xxxxxxxxxxxx">
    </div>

    <div class="btn-group">
        <button onclick="sendCloudAction('open')">🚀 Open & Install Interstellar</button>
        <button id="refreshBtn" onclick="sendCloudAction('refresh')">🔄 Refresh Server</button>
        <button id="redeployBtn" onclick="sendCloudAction('redeploy')">⚡ Redeploy Server</button>
    </div>

    <div id="status">System Ready. Awaiting action execution...</div>

    <script>
        // ⚠️ CHANGE THESE TWO VALUES TO YOUR ACTUAL REPO INFO:
        const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME"; 
        const REPO_NAME = "YOUR_REPO_NAME"; 

        async function sendCloudAction(actionType) {
            const token = document.getElementById('apiKey').value;
            const statusDiv = document.getElementById('status');
            
            if(!token) {
                alert("Please enter your GitHub Personal Access Token key first!");
                return;
            }

            statusDiv.textContent = `📡 Broadcasting '${actionType}' instruction to GitHub Cloud execution nodes...`;

            try {
                const response = await fetch(`https://github.com{GITHUB_USERNAME}/${REPO_NAME}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: "control_action",
                        client_payload: { action: actionType }
                    })
                });

                if (response.status === 204) {
                    statusDiv.textContent = `✅ Success! GitHub Cloud has intercepted the command.\n\nYour automation engine is now executing '${actionType}' in the background.`;
                } else {
                    statusDiv.textContent = `❌ Error: Connection failed. Verify your token permissions. Status: ${response.status}`;
                }
            } catch (err) {
                statusDiv.textContent = "❌ Network Error: Failed to contact the cloud relay infrastructure.";
            }
        }
    </script>
</body>
</html>
