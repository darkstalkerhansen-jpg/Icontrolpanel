<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Control Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        /* Detected URL Input Field Styles */
        .url-box-container { background: #1e1e1e; border: 1px solid #3b82f6; border-radius: 6px; padding: 15px; margin-bottom: 25px; }
        .url-box-label { font-size: 14px; color: #9ca3af; margin-bottom: 5px; font-weight: bold; }
        .url-display-input { width: 95%; background: #000; border: 1px solid #444; color: #3b82f6; font-family: monospace; font-size: 16px; padding: 10px; border-radius: 4px; font-weight: bold; cursor: default; }
        
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        button { background: #2563eb; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        #refreshBtn { background: #d97706; }
        #refreshBtn:hover { background: #b45309; }
        #redeployBtn { background: #059669; }
        #redeployBtn:hover { background: #047857; }
        #console { background: #000; color: #0f0; font-family: monospace; padding: 15px; border-radius: 6px; height: 250px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #333; font-size: 13px; }
    </style>
</head>
<body>

    <h1>🌌 Interstellar Controller</h1>
    
    <!-- Read-Only Detected URL Box -->
    <div class="url-box-container">
        <div class="url-box-label">🔗 DETECTED LOCALHOST URL:</div>
        <input type="text" id="detectedUrl" class="url-display-input" value="Awaiting script startup..." readonly onclick="this.select();">
    </div>
    
    <div class="btn-group">
        <button id="openBtn" onclick="triggerAction('open')">🚀 Open & Install Interstellar</button>
        <button id="refreshBtn" onclick="triggerAction('refresh')">🔄 Refresh Server (Timeout Fix)</button>
        <button id="redeployBtn" onclick="triggerAction('redeploy')">⚡ Redeploy Server</button>
    </div>

    <h3>Live Terminal Output:</h3>
    <div id="console">Ready. Click a button to begin...</div>

    <script>
        function triggerAction(actionType) {
            const consoleDiv = document.getElementById('console');
            const urlInput = document.getElementById('detectedUrl');
            const buttons = document.querySelectorAll('button');
            
            buttons.forEach(b => b.disabled = true);
            consoleDiv.textContent = `Starting stream for ${actionType}...\n`;
            urlInput.value = "Scanning terminal output for URL...";

            // Connects directly to backend's SSE logging route
            const eventSource = new EventSource(`/api/stream-logs?action=${actionType}`);

            eventSource.onmessage = function(event) {
                const logLine = event.data;

                if (logLine.includes('[PROCESS_EXITED_WITH_CODE_')) {
                    eventSource.close();
                    buttons.forEach(b => b.disabled = false);
                    consoleDiv.textContent += "\n[Execution Finished]\n";
                    return;
                }

                consoleDiv.textContent += logLine + "\n";
                consoleDiv.scrollTop = consoleDiv.scrollHeight;

                // Regex scanning for any generated localhost link pattern (e.g. http://localhost:8080)
                const urlMatch = logLine.match(/http:\/\/localhost:\d+/i);
                if (urlMatch) {
                    urlInput.value = urlMatch; 
                }
            };

            eventSource.onerror = function() {
                eventSource.close();
                buttons.forEach(b => b.disabled = false);
                consoleDiv.textContent += "\n❌ Stream connection closed or script completed execution.";
            };
        }
    </script>
</body>
</html>
